<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 330 272' width='330' height='272'><rect width='330' height='272' fill='white'/><text x='165.0' y='16.0' font-size='11.5' text-anchor='middle' fill='#1f2933' font-weight='bold' font-family='Noto Sans KR, sans-serif'>σ만 있을 때 (왼쪽)  vs  π 주개 F⁻ (오른쪽)</text><line x1='30.0' y1='60.0' x2='90.0' y2='60.0' stroke='#1f2933' stroke-width='1.6'/><text x='60.0' y='54.0' font-size='11' text-anchor='middle' fill='#1f2933' font-weight='normal' font-family='Noto Sans KR, sans-serif'>e<tspan baseline-shift='sub' font-size='9'>g</tspan>*</text><line x1='30.0' y1='140.0' x2='90.0' y2='140.0' stroke='#1f2933' stroke-width='1.6'/><text x='60.0' y='158.0' font-size='11' text-anchor='middle' fill='#1f2933' font-weight='normal' font-family='Noto Sans KR, sans-serif'>t<tspan baseline-shift='sub' font-size='9'>2g</tspan> (비결합)</text><path d='M100 60 L100 140' stroke='#1d4ed8' stroke-width='1.3'/><text x='118.0' y='104.0' font-size='12' text-anchor='middle' fill='#1d4ed8' font-weight='normal' font-family='Noto Sans KR, sans-serif'>Δo</text><line x1='190.0' y1='60.0' x2='250.0' y2='60.0' stroke='#1f2933' stroke-width='1.6'/><text x='220.0' y='54.0' font-size='11' text-anchor='middle' fill='#1f2933' font-weight='normal' font-family='Noto Sans KR, sans-serif'>e<tspan baseline-shift='sub' font-size='9'>g</tspan>*</text><line x1='190.0' y1='105.0' x2='250.0' y2='105.0' stroke='#c0392b' stroke-width='2'/><text x='220.0' y='97.0' font-size='10.5' text-anchor='middle' fill='#c0392b' font-weight='normal' font-family='Noto Sans KR, sans-serif'>t<tspan baseline-shift='sub' font-size='9'>2g</tspan>* (위로 밀림)</text><line x1='190.0' y1='140.0' x2='250.0' y2='140.0' stroke='#6b7280' stroke-width='1' stroke-dasharray='4 3'/><text x='282.0' y='144.0' font-size='9.5' text-anchor='start' fill='#6b7280' font-weight='normal' font-family='Noto Sans KR, sans-serif'>원래 t₂g</text><line x1='190.0' y1='200.0' x2='250.0' y2='200.0' stroke='#1f2933' stroke-width='2'/><text x='220.0' y='218.0' font-size='10.5' text-anchor='middle' fill='#1f2933' font-weight='normal' font-family='Noto Sans KR, sans-serif'>리간드 π (채워짐, t<tspan baseline-shift='sub' font-size='9'>2g</tspan>) → 결합성</text><path d='M260 60 L260 105' stroke='#1d4ed8' stroke-width='1.3'/><text x='282.0' y='86.0' font-size='12' text-anchor='start' fill='#1d4ed8' font-weight='normal' font-family='Noto Sans KR, sans-serif'>Δo′</text><line x1='220.0' y1='194.0' x2='220.0' y2='112.0' stroke='#6b7280' stroke-width='1' stroke-dasharray='3 3'/><text x='165.0' y='244.0' font-size='10.5' text-anchor='middle' fill='#c0392b' font-weight='normal' font-family='Noto Sans KR, sans-serif'>채워진 리간드 π와 섞여 t₂g가 올라감 → Δo′ &lt; Δo</text><text x='165.0' y='262.0' font-size='10' text-anchor='middle' fill='#6b7280' font-weight='normal' font-family='Noto Sans KR, sans-serif'>(π 받개 CO·CN⁻는 빈 π*가 t₂g를 끌어내려 Δo가 커짐)</text></svg>