<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 330 298' width='330' height='298'><rect width='330' height='298' fill='white'/><text x='165.0' y='16.0' font-size='11.5' text-anchor='middle' fill='#1f2933' font-weight='bold' font-family='Noto Sans KR, sans-serif'>B₁–H_A–B₂ 3중심 2전자 결합</text><line x1='40.0' y1='120.0' x2='90.0' y2='120.0' stroke='#1f2933' stroke-width='1.6'/><text x='65.0' y='112.0' font-size='10.5' text-anchor='middle' fill='#1f2933' font-weight='normal' font-family='Noto Sans KR, sans-serif'>χB₁−χB₂</text><line x1='40.0' y1='140.0' x2='90.0' y2='140.0' stroke='#1f2933' stroke-width='1.6'/><text x='65.0' y='158.0' font-size='10.5' text-anchor='middle' fill='#1f2933' font-weight='normal' font-family='Noto Sans KR, sans-serif'>χB₁+χB₂</text><text x='65.0' y='178.0' font-size='10' text-anchor='middle' fill='#6b7280' font-weight='normal' font-family='Noto Sans KR, sans-serif'>B sp³ 조합</text><line x1='265.0' y1='130.0' x2='305.0' y2='130.0' stroke='#1f2933' stroke-width='1.6'/><text x='285.0' y='122.0' font-size='10.5' text-anchor='middle' fill='#1f2933' font-weight='normal' font-family='Noto Sans KR, sans-serif'>H 1s</text><line x1='150.0' y1='50.0' x2='200.0' y2='50.0' stroke='#c0392b' stroke-width='2'/><text x='175.0' y='42.0' font-size='10.5' text-anchor='middle' fill='#c0392b' font-weight='normal' font-family='Noto Sans KR, sans-serif'>ψ_a (반결합)</text><line x1='150.0' y1='120.0' x2='200.0' y2='120.0' stroke='#1f2933' stroke-width='2'/><text x='175.0' y='112.0' font-size='10.5' text-anchor='middle' fill='#1f2933' font-weight='normal' font-family='Noto Sans KR, sans-serif'>ψ_n (비결합)</text><line x1='150.0' y1='215.0' x2='200.0' y2='215.0' stroke='#1d4ed8' stroke-width='2'/><path d='M170 212 L170 196 M166 202 L170 196 L174 202' stroke='#1d4ed8' stroke-width='1.6' fill='none'/><path d='M180 196 L180 212 M176 206 L180 212 L184 206' stroke='#1d4ed8' stroke-width='1.6' fill='none'/><text x='175.0' y='233.0' font-size='10.5' text-anchor='middle' fill='#1d4ed8' font-weight='normal' font-family='Noto Sans KR, sans-serif'>ψ_b (결합, 전자 2개)</text><line x1='90.0' y1='140.0' x2='150.0' y2='50.0' stroke='#6b7280' stroke-width='1' stroke-dasharray='3 3'/><line x1='90.0' y1='140.0' x2='150.0' y2='215.0' stroke='#6b7280' stroke-width='1' stroke-dasharray='3 3'/><line x1='265.0' y1='130.0' x2='200.0' y2='50.0' stroke='#6b7280' stroke-width='1' stroke-dasharray='3 3'/><line x1='265.0' y1='130.0' x2='200.0' y2='215.0' stroke='#6b7280' stroke-width='1' stroke-dasharray='3 3'/><line x1='90.0' y1='120.0' x2='150.0' y2='120.0' stroke='#6b7280' stroke-width='1' stroke-dasharray='3 3'/><text x='165.0' y='256.0' font-size='10.5' text-anchor='middle' fill='#1f2933' font-weight='normal' font-family='Noto Sans KR, sans-serif'>ψ_b = ½χB₁ + (1/√2)χH + ½χB₂</text><text x='165.0' y='272.0' font-size='10.5' text-anchor='middle' fill='#1f2933' font-weight='normal' font-family='Noto Sans KR, sans-serif'>ψ_n = (1/√2)(χB₁ − χB₂)   (H 1s와 대칭이 안 맞음)</text><text x='165.0' y='288.0' font-size='10.5' text-anchor='middle' fill='#c0392b' font-weight='normal' font-family='Noto Sans KR, sans-serif'>ψ_a = ½χB₁ − (1/√2)χH + ½χB₂</text></svg>